name: Fork Build

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: "构建 Windows x64 便携版"
        required: false
        default: true
        type: boolean
      build_android:
        description: "构建 Android APK"
        required: false
        default: true
        type: boolean
      tag:
        description: "发布 tag（留空则只上传 artifact）"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    if: ${{ github.event.inputs.build_windows != 'false' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Install fastforge and Inno Setup
        run: |
          dart pub global activate fastforge
          choco install innosetup --no-progress
          Copy-Item "windows/packaging/exe/ChineseSimplified.isl" "C:\Program Files (x86)\Inno Setup 6\Languages\ChineseSimplified.isl"
        shell: pwsh

      - name: Set version
        run: lib/scripts/build.ps1
        shell: pwsh

      - name: Apply Flutter patches
        run: lib/scripts/patch.ps1 windows
        shell: pwsh

      - name: Build Windows
        run: fastforge package --platform windows --targets exe --flutter-build-args="dart-define-from-file=pili_release.json,no-pub" --skip-clean

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Release/PiliNara-Win | Out-Null
          Copy-Item build/windows/x64/runner/Release/* Release/PiliNara-Win/ -Recurse -Force
          Compress-Archive -Path Release/PiliNara-Win -DestinationPath "PiliNara_windows_${{ env.version }}_x64_portable.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PiliNara-Windows-x64
          path: PiliNara_windows_*_x64_portable.zip

      - name: Release
        if: ${{ github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          target_commitish: ${{ github.sha }}
          files: PiliNara_windows_*_x64_portable.zip

  android:
    name: Android
    if: ${{ github.event.inputs.build_android != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply Flutter patches
        shell: pwsh
        run: lib/scripts/patch.ps1 android
        continue-on-error: true

      - name: Write signing key
        shell: bash
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SIGN_KEYSTORE_BASE64" ]; then
            echo "::notice::未配置签名 secrets，APK 将使用 debug 签名（仅适合自用安装；发布/覆盖升级请配置签名）"
            exit 0
          fi
          echo "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          cat > android/key.properties <<EOF
          storeFile=key.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Set version
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: Build APK
        run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --pub

      - name: Rename APKs
        shell: bash
        run: |
          for file in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
            mv "$file" "PiliNara_android_${{ env.version }}_${abi}.apk"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PiliNara-Android
          path: PiliNara_android_*.apk

      - name: Release
        if: ${{ github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          target_commitish: ${{ github.sha }}
          files: PiliNara_android_*.apk
